services:
  - type: web
    name: mental-health-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: DATABASE_NAME
        value: mental_health_db
      - key: JWT_SECRET
        generateValue: true   # Auto-generated secure value
      - key: GROQ_API_KEY
        sync: false           # Set manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEBUG
        value: "false"
      - key: ENABLE_CORS
        value: "true"
      - key: DISABLE_VOICE
        value: "true"         # Disable whisper on free tier
