name: Keep Backend Awake

# Render's free tier puts the backend to sleep after 15 minutes without traffic, and waking
# it sometimes fails (503 "x-render-routing: hibernate-wake-error"), leaving requests stuck.
# Pinging /health keeps it awake. GitHub can delay scheduled runs by several minutes,
# so ping well inside the 15-minute window.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 10 https://health-peek-2.onrender.com/health
