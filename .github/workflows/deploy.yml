name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mental-health-frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mental-health-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mental-health-frontend
        run: npm ci

      - name: Build
        working-directory: mental-health-frontend
        env:
          # Override these via GitHub repo Secrets (Settings → Secrets → Actions) for security
          REACT_APP_API_URL: https://health-peek-2.onrender.com
          REACT_APP_GOOGLE_CLIENT_ID: 936805493619-25oan5b3nm3g8f1ru7k7lhmc5upnta2q.apps.googleusercontent.com
          REACT_APP_ENVIRONMENT: production
          REACT_APP_VERSION: 1.0.0
          REACT_APP_FRONTEND_URL: https://manisharai01.github.io/health-peek
          CI: false
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: mental-health-frontend/build
          branch: gh-pages
          clean: true
